<div id="lightbox" role="dialog" aria-modal="true" aria-label="Tampilan foto perbesar" class="fixed inset-0 z-50">

  <div class="relative h-full flex flex-col">

    </div>

    <div class="flex-1 flex items-center justify-center px-4 sm:px-16 relative min-h-0">
      <button id="lightbox-prev" aria-label="Foto sebelumnya" class="absolute left-1 sm:left-4 text-white text-3xl px-3 py-6">&#8249;</button>
      <img id="lightbox-img" src="" alt="" class="max-h-[70vh] sm:max-h-[75vh] max-w-full object-contain" />
      <button id="lightbox-next" aria-label="Foto berikutnya" class="absolute right-1 sm:right-4 text-white text-3xl px-3 py-6">&#8250;</button>
    </div>

    <p id="lightbox-caption" class="text-center text-white/80 text-sm py-6 px-6"></p>
